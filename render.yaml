services:
  - type: web
    name: ravn-south-public
    runtime: static
    buildCommand: echo "Public site ready"
    staticPublishPath: .
    autoDeployTrigger: off
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
