name: Ravnsouth mobile builds

on:
  pull_request:
    paths:
      - '.github/workflows/repbook-ios.yml'
      - 'mobile/**'
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.png'
      - 'assets/**'
      - 'vendor/**'

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run ios:sync
      - name: Build for the iPhone simulator
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install the Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run android:sync
      - name: Build the Android APK and release bundle
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Ravnsouth-Android
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
